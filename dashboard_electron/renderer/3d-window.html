<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Terrain View — Sector Elevation & Satellite View</title>
  <link rel="stylesheet" href="lib/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/hmi.css">
  <link rel="stylesheet" href="css/terrain-3d.css">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #070D12;
      overflow: hidden;
      font-family: 'Courier New', monospace;
    }
    .standalone-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .standalone-header {
      height: 28px;
      background: #243040;
      border-bottom: 1px solid #2E3E4A;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      color: #D4D8DC;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-family: Tahoma, 'Segoe UI', Arial, sans-serif;
    }
    .standalone-status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00CC44;
      border: 1px solid rgba(0, 0, 0, 0.4);
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.25);
      margin-right: 8px;
    }
    .standalone-tag {
      background: #14222A;
      border: 1px solid #284452;
      color: #00E676;
      padding: 1px 6px;
      border-radius: 2px;
      margin-left: 8px;
      font-family: 'Courier New', monospace;
      font-size: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="standalone-container">
    <div class="standalone-header">
      <div style="display:flex; align-items:center;">
        <span style="color:#7A9BAA; font-size:10px; font-family:'Courier New',monospace;" id="standalone-coords">Lat: 18.6435°N, Lng: 79.5725°E</span>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:10px; color:#78909C;">GOOGLE EARTH:</span>
        <button class="terrain-redirect-btn" id="std-btn-launch-earth" title="Open Sector in Google Earth 3D (60° Tilt)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:block;">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="terrain-win-toolbar" style="padding:6px 14px;">
      <div style="display:flex; gap:6px; align-items:center;" id="std-real3d-controls">
        <span style="font-size:9.5px; color:#94A3B8; font-weight:bold;">3D TILT:</span>
        <button class="terrain-tool-btn active" id="std-btn-iso">65° ISO</button>
        <button class="terrain-tool-btn" id="std-btn-top">TOP 2D</button>
        <button class="terrain-tool-btn" id="std-btn-steep">78° STEEP</button>
        <span style="width:1px; height:16px; background:#2A3B4A; margin:0 4px;"></span>
        <!-- Vertical exaggeration. The z15 DEM resolves ~4.5 m/pixel, so a
             sector's ~34 m of relief is real but visually flat at true scale;
             these let the operator trade fidelity for legibility. -->
        <span style="font-size:9.5px; color:#94A3B8; font-weight:bold;">VERT EXAG:</span>
        <button class="terrain-tool-btn" id="std-btn-exag-1">1x</button>
        <button class="terrain-tool-btn active" id="std-btn-exag-3">3x</button>
        <button class="terrain-tool-btn" id="std-btn-exag-5">5x</button>
        <span style="width:1px; height:16px; background:#2A3B4A; margin:0 4px;"></span>
        <span style="font-size:9.5px; color:#94A3B8; font-weight:bold;">HEATMAP:</span>
        <select id="std-heatmap-mode" style="background:#14222A; color:#D4D8DC; border:1px solid #2E3E4A; border-radius:2px; font-family:'Courier New',monospace; font-size:10px; padding:2px 4px; cursor:pointer;">
          <option value="none">None</option>
          <option value="depth">Depth (m)</option>
          <option value="tilt">Tilt (mm/m)</option>
          <option value="strain">Strain (mm/m)</option>
          <option value="curvature">Curvature (1/m)</option>
          <option value="ppv">PPV (mm/s)</option>
          <option value="risk">Risk Index</option>
        </select>
      </div>
    </div>

    <!-- Main 3D Viewport -->
    <div class="terrain-win-body" style="flex:1;">
      <div class="terrain-canvas-container" id="std-canvas-container">
        <div id="std-terrain-map" style="width:100%; height:100%;"></div>

        <div class="terrain-hud-stats" style="top:14px; left:14px;">
          <div class="terrain-hud-line">SECTOR: <span class="terrain-hud-val" id="std-stat-sector">E5</span></div>
          <div class="terrain-hud-line">DEM ELEVATION: <span class="terrain-hud-val">194m - 228m MSL</span></div>
          <div class="terrain-hud-line">ENGINE: <span class="terrain-hud-val">Real Satellite 3D DEM</span></div>
          <div class="terrain-hud-line">SURFACE SENSORS: <span class="terrain-hud-val" id="std-stat-sensors">0 Detected</span></div>
        </div>

        <div class="terrain-hud-legend-box" style="bottom:14px; left:14px;">
          <div class="terrain-legend-item"><span class="terrain-legend-color" style="background:#00CC44;"></span>ACTIVE</div>
          <div class="terrain-legend-item"><span class="terrain-legend-color" style="background:#FFA500;"></span>WARNING</div>
          <div class="terrain-legend-item"><span class="terrain-legend-color" style="background:#FF2222;"></span>CRITICAL</div>
        </div>
      </div>

      <!-- Right Sensor Sidebar -->
      <div class="terrain-nodes-sidebar" id="std-nodes-sidebar" style="width:230px;">
        <div class="terrain-sidebar-header">SECTOR SENSORS (8x8)</div>
        <div id="std-node-cards-list" style="flex:1; overflow-y:auto;"></div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="lib/maplibre/maplibre-gl.js"></script>
  <script src="js/map/real-terrain-3d.js"></script>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var sectorId = params.get('sector') || 'E5';
      var sectorData = null;

      // Fetch fixtures
      Promise.all([
        fetch('../fixtures/panel_outline.geojson').then(r => r.json()),
        fetch('../fixtures/nodes.json').then(r => r.json())
      ]).then(([panelGeo, nodesData]) => {
        window.fixtureProvider = { getNodes: () => nodesData };

        var feature = panelGeo.features.find(f => f.properties.grid_id === sectorId) || panelGeo.features[1];
        var coords = feature.geometry.coordinates[0];

        var minLng = Math.min(...coords.map(c => c[0]));
        var maxLng = Math.max(...coords.map(c => c[0]));
        var minLat = Math.min(...coords.map(c => c[1]));
        var maxLat = Math.max(...coords.map(c => c[1]));

        var cellNodes = nodesData.filter(n => n.lat >= minLat && n.lat < maxLat && n.lng >= minLng && n.lng < maxLng).map(n => n.node_id);

        sectorData = {
          id: sectorId,
          row: sectorId[0],
          col: parseInt(sectorId.slice(1)),
          bounds: [[minLat, minLng], [maxLat, maxLng]],
          center: [(minLat + maxLat) / 2, (minLng + maxLng) / 2],
          latRange: [minLat, maxLat],
          lngRange: [minLng, maxLng],
          nodes: cellNodes,
          nodeCount: cellNodes.length
        };

        var stdTag = document.getElementById('standalone-sector-tag');
        if (stdTag) stdTag.textContent = 'SECTOR ' + sectorId;
        document.getElementById('std-stat-sector').textContent = sectorId;
        document.getElementById('std-stat-sensors').textContent = cellNodes.length + ' Detected';
        document.getElementById('standalone-coords').textContent = 'Lat: ' + minLat.toFixed(4) + '°-' + maxLat.toFixed(4) + '°N | Lng: ' + minLng.toFixed(4) + '°-' + maxLng.toFixed(4) + '°E';

        realTerrain3D.init('std-terrain-map', sectorData);

        // Populate sensor cards
        var listContainer = document.getElementById('std-node-cards-list');
        listContainer.innerHTML = '';
        if (cellNodes.length === 0) {
          listContainer.innerHTML = '<div style="padding:16px 10px; color:#64748B; text-align:center;">No surface sensor nodes in this peripheral block.</div>';
        } else {
          cellNodes.forEach(nodeId => {
            var n = nodesData.find(item => item.node_id === nodeId);
            if (!n) return;
            var card = document.createElement('div');
            card.className = 'terrain-node-card';
            var col = (n.state === 'critical') ? '#FF2222' : (n.state === 'warning' ? '#FFA500' : '#00CC44');
            card.innerHTML = 
              '<div class="terrain-node-card-title"><span><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:' + col + ';margin-right:5px;"></span>' + n.node_id + '</span><span style="color:' + col + ';">' + n.state.toUpperCase() + '</span></div>' +
              '<div class="terrain-node-card-sub">Ring: ' + (n.ring || 'core') + ' | Strain: ' + (n.state === 'critical' ? '890' : '142') + ' µε</div>';
            listContainer.appendChild(card);
          });
        }

        window.addEventListener('resize', () => {
          realTerrain3D.onResize();
        });
      });

      // Tilt presets
      var btnIso = document.getElementById('std-btn-iso');
      var btnTop = document.getElementById('std-btn-top');
      var btnSteep = document.getElementById('std-btn-steep');

      btnIso.addEventListener('click', function () {
        setActiveTilt(this);
        realTerrain3D.setCameraPreset('iso');
      });
      btnTop.addEventListener('click', function () {
        setActiveTilt(this);
        realTerrain3D.setCameraPreset('top');
      });
      btnSteep.addEventListener('click', function () {
        setActiveTilt(this);
        realTerrain3D.setCameraPreset('steep');
      });

      // Vertical exaggeration presets
      var exagBtns = {
        1: document.getElementById('std-btn-exag-1'),
        3: document.getElementById('std-btn-exag-3'),
        5: document.getElementById('std-btn-exag-5')
      };
      Object.keys(exagBtns).forEach(function (factor) {
        exagBtns[factor].addEventListener('click', function () {
          Object.keys(exagBtns).forEach(function (f) {
            exagBtns[f].classList.remove('active');
          });
          this.classList.add('active');
          realTerrain3D.setExaggeration(parseFloat(factor));
        });
      });

      function setActiveTilt(activeBtn) {
        [btnIso, btnTop, btnSteep].forEach(b => b.classList.remove('active'));
        activeBtn.classList.add('active');
      }

      // External Google Earth Launcher
      document.getElementById('std-btn-launch-earth').addEventListener('click', function () {
        if (!sectorData) return;
        var cLat = sectorData.center[0];
        var cLng = sectorData.center[1];
        window.open('https://earth.google.com/web/@' + cLat + ',' + cLng + ',230a,400d,35y,45h,60t,0r', '_blank');
      });

      // Heatmap overlay for standalone 3D window
      var HEATMAP_STOPS = {
        depth:     [[0.00,'#06b6d4'],[0.25,'#3b82f6'],[0.50,'#8b5cf6'],[0.75,'#d946ef'],[1.00,'#ff0055']],
        tilt:      [[0.00,'#00e5ff'],[0.25,'#10b981'],[0.50,'#facc15'],[0.75,'#fb923c'],[1.00,'#ef4444']],
        strain:    [[0.00,'#38bdf8'],[0.25,'#6366f1'],[0.50,'#a855f7'],[0.75,'#ec4899'],[1.00,'#f43f5e']],
        curvature: [[0.00,'#06b6d4'],[0.35,'#3b82f6'],[0.60,'#a855f7'],[0.80,'#f43f5e'],[1.00,'#fbbf24']],
        ppv:       [[0.00,'#38bdf8'],[0.25,'#818cf8'],[0.50,'#f472b6'],[0.75,'#fb7185'],[1.00,'#ef4444']],
        risk:      [[0.00,'#10b981'],[0.25,'#84cc16'],[0.50,'#f59e0b'],[0.75,'#ea580c'],[1.00,'#dc2626']]
      };
      var HEATMAP_RES = 96;

      function hexToRgb(hex) {
        var n = parseInt(hex.slice(1), 16);
        return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
      }

      function sampleRamp(t, stops) {
        var tc = Math.min(1.0, Math.max(0.0, t));
        for (var i = 0; i < stops.length - 1; i++) {
          if (tc >= stops[i][0] && tc <= stops[i + 1][0]) {
            var f = stops[i + 1][0] === stops[i][0] ? 0 : (tc - stops[i][0]) / (stops[i + 1][0] - stops[i][0]);
            var a = hexToRgb(stops[i][1]), b = hexToRgb(stops[i + 1][1]);
            return [Math.round(a[0]+f*(b[0]-a[0])), Math.round(a[1]+f*(b[1]-a[1])), Math.round(a[2]+f*(b[2]-a[2]))];
          }
        }
        return hexToRgb(stops[stops.length - 1][1]);
      }

      var stdHeatmapSelect = document.getElementById('std-heatmap-mode');
      if (stdHeatmapSelect) {
        stdHeatmapSelect.addEventListener('change', function () {
          var mode = this.value;
          var mlMap = realTerrain3D.getMap ? realTerrain3D.getMap('std-terrain-map') : null;
          if (!mlMap) return;

          try { if (mlMap.getLayer('heatmap-layer')) mlMap.removeLayer('heatmap-layer'); } catch(_){}
          try { if (mlMap.getSource('heatmap-source')) mlMap.removeSource('heatmap-source'); } catch(_){}

          if (mode === 'none' || !HEATMAP_STOPS[mode] || !sectorData) return;

          var sb = { minLat: sectorData.bounds[0][0], maxLat: sectorData.bounds[1][0],
                     minLng: sectorData.bounds[0][1], maxLng: sectorData.bounds[1][1] };

          var hCanvas = document.createElement('canvas');
          hCanvas.width = HEATMAP_RES; hCanvas.height = HEATMAP_RES;
          var hCtx = hCanvas.getContext('2d');
          var imgData = hCtx.createImageData(HEATMAP_RES, HEATMAP_RES);
          var data = imgData.data;
          var stops = HEATMAP_STOPS[mode];

          var ORIGIN_LAT = 18.6435;
          var ORIGIN_LON = 79.5725;
          var M_PER_DEG_LAT = 111320.0;
          var M_PER_DEG_LON = M_PER_DEG_LAT * Math.cos(ORIGIN_LAT * Math.PI / 180);
          function toXY(lat, lon) {
            return [(lon - ORIGIN_LON) * M_PER_DEG_LON, (lat - ORIGIN_LAT) * M_PER_DEG_LAT];
          }

          var openerHeatmap = null;
          try {
            if (window.opener && window.opener.heatmapOverlay && window.opener.heatmapOverlay.evaluatePoint) {
              openerHeatmap = window.opener.heatmapOverlay;
            }
          } catch (_) {}

          for (var row = 0; row < HEATMAP_RES; row++) {
            var lat = sb.maxLat - (row + 0.5) * (sb.maxLat - sb.minLat) / HEATMAP_RES;
            for (var col = 0; col < HEATMAP_RES; col++) {
              var lng = sb.minLng + (col + 0.5) * (sb.maxLng - sb.minLng) / HEATMAP_RES;
              var t = 0;

              if (openerHeatmap) {
                try {
                  var xy = toXY(lat, lng);
                  var pt = openerHeatmap.evaluatePoint(xy[0], xy[1]);
                  t = Math.min(1.0, Math.max(0.0, openerHeatmap.channelValue(mode, pt)));
                } catch (_) {}
              }

              if (!openerHeatmap) {
                var targetLng = (sb.minLng + sb.maxLng) / 2;
                var targetLat = (sb.minLat + sb.maxLat) / 2;
                if (sectorData && sectorData.nodes && sectorData.nodes.length > 0 && Array.isArray(nodesData)) {
                  var warnNodes = nodesData.filter(function (n) {
                    return sectorData.nodes.indexOf(n.node_id) !== -1 && (n.state === 'critical' || n.state === 'warning');
                  });
                  if (warnNodes.length > 0) {
                    targetLng = warnNodes[0].lng;
                    targetLat = warnNodes[0].lat;
                  }
                }
                var dLng = (lng - targetLng) / (sb.maxLng - sb.minLng);
                var dLat = (lat - targetLat) / (sb.maxLat - sb.minLat);
                var dist = Math.hypot(dLng, dLat) * 2;
                if (mode === 'depth') t = Math.max(0, 1.0 - dist / 0.8) * 0.7;
                else if (mode === 'tilt') t = Math.exp(-Math.pow((dist - 0.3) / 0.2, 2)) * 0.8;
                else if (mode === 'strain') t = Math.exp(-Math.pow(dist / 0.4, 2)) * 0.6;
                else if (mode === 'curvature') t = Math.exp(-Math.pow(dist / 0.3, 2)) * 0.7;
                else if (mode === 'ppv') t = Math.max(0, 1.0 - dist / 0.9) * 0.5;
                else if (mode === 'risk') t = Math.max(0, 1.0 - dist / 0.7) * 0.65;
              }

              t = Math.min(1.0, Math.max(0.0, t));
              var rgb = sampleRamp(t, stops);
              var normT = Math.max(0, (t - 0.04) / 0.96);
              var alpha = t < 0.04 ? 0 : Math.min(215, Math.round(75 + 140 * Math.pow(normT, 0.85)));
              var idx = (row * HEATMAP_RES + col) * 4;
              data[idx] = rgb[0]; data[idx+1] = rgb[1]; data[idx+2] = rgb[2]; data[idx+3] = alpha;
            }
          }
          hCtx.putImageData(imgData, 0, 0);

          mlMap.addSource('heatmap-source', {
            type: 'image', url: hCanvas.toDataURL(),
            coordinates: [
              [sb.minLng, sb.maxLat], [sb.maxLng, sb.maxLat],
              [sb.maxLng, sb.minLat], [sb.minLng, sb.minLat]
            ]
          });
          mlMap.addLayer({
            id: 'heatmap-layer', type: 'raster', source: 'heatmap-source',
            paint: { 'raster-opacity': 0.88, 'raster-fade-duration': 0 }
          });
        });
      }
    })();
  </script>
</body>
</html>
