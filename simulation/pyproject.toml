[project]
name = "mine-sandbox"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pydantic>=2.0.0",
    "asyncpg>=0.29.0",
    "paho-mqtt>=2.1.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "matplotlib>=3.8.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
offline-render = [
    "pyvista>=0.48.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
