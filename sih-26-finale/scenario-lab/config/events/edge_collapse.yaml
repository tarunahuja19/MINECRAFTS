# Scenario event: the coal pillar along one panel edge fails, widening the extracted span (WP9 §5 row 3).
# Every value here is a SCENARIO INPUT — a user hypothesis, not a measurement at this mine (Invariant 7).
schema_version: 1
name: edge_collapse
title: "Panel edge collapse"
plain: "The chain pillar along one rib crushes, so the ground behaves as if the panel were that much wider."

inputs:
  pillar_width_m:
    default: 20.0
    min: 2.0
    max: 100.0
    unit: m
    source: "scenario input — not measured at this mine; the width of pillar assumed to fail"
  length_m:
    default: 300.0
    min: 20.0
    max: 2500.0
    unit: m
    source: "scenario input — not measured at this mine; how far along the rib the failure runs"
